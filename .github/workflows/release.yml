name: Release WebMCP Deck

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Code
        run: npm run build

      - name: Package macOS (Apple Silicon & Intel)
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac --arm64 --x64 --publish never
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS-mac.txt || true
          cat SHA256SUMS-mac.txt || true

      - name: Package Windows (x64)
        if: runner.os == 'Windows'
        run: |
          npx electron-builder --win --x64 --publish never
          cd dist
          Get-FileHash -Algorithm SHA256 WebMCP-Deck-Setup-*.exe, *.zip | Format-List > SHA256SUMS-win.txt
          Get-Content SHA256SUMS-win.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/WebMCP-Deck-*.dmg
            dist/WebMCP-Deck-*.zip
            dist/WebMCP-Deck-Setup-*.exe
            dist/SHA256SUMS-*.txt

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download macOS Assets and Compute SHA256
        id: shasum
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          
          ARM_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/WebMCP-Deck-${VERSION}-arm64.dmg"
          INTEL_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/WebMCP-Deck-${VERSION}-x64.dmg"
          
          echo "Downloading $ARM_URL ..."
          curl -sL --retry 3 --fail "$ARM_URL" -o arm64.dmg
          ARM_SHA=$(shasum -a 256 arm64.dmg | awk '{print $1}')
          
          echo "Downloading $INTEL_URL ..."
          curl -sL --retry 3 --fail "$INTEL_URL" -o x64.dmg
          INTEL_SHA=$(shasum -a 256 x64.dmg | awk '{print $1}')
          
          echo "ARM64_SHA=$ARM_SHA" >> $GITHUB_OUTPUT
          echo "INTEL_SHA=$INTEL_SHA" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TAP_APP_ID || secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: blue1st
          repositories: homebrew-taps

      - name: Update Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256_ARM: ${{ steps.shasum.outputs.ARM64_SHA }}
          SHA256_X64: ${{ steps.shasum.outputs.INTEL_SHA }}
        run: |
          chmod +x ./scripts/update-homebrew.sh
          ./scripts/update-homebrew.sh
